name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run typecheck:tests

      - name: Check examples typecheck
        run: npm run examples:check

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check public API documentation coverage
        run: npm run check-docs

      - name: Restore Jest cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: .jest-cache
          key: jest-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'jest.config.js') }}

      - name: Run tests
        if: matrix.node-version != '22.x'
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: coverage
          path: coverage/

      - name: Build package
        run: npm run build

      - name: Check published package types
        run: npm run typecheck:published

      - name: Build documentation
        run: npm run docs

      - name: Check build artifacts
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.mjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✓ All build artifacts present"

      - name: Check bundle size
        run: npm run size
